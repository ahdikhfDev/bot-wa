<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot-WA · Dashboard</title>
<style>
:root {
  --bg: #000000;
  --surface: #0d0d0d;
  --surface-2: #1a1a1a;
  --surface-3: #262626;
  --border: #2a2a2a;
  --border-light: #333333;
  --text: #ffffff;
  --text-2: #cccccc;
  --text-3: #999999;
  --accent: #ffffff;
  --accent-2: #e0e0e0;
  --green: #4ade80;
  --green-bg: #1a3a2a;
  --red: #f87171;
  --red-bg: #3a1a1a;
  --yellow: #fbbf24;
  --yellow-bg: #3a2a10;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Fira Code', monospace;
  --sidebar: 240px;
  --header-h: 56px;
  --transition: .2s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Hide scrollbar for Chrome, Safari and Opera */
*::-webkit-scrollbar { display: none; }
/* Hide scrollbar for IE, Edge and Firefox */
* { -ms-overflow-style: none; scrollbar-width: none; }

.model-card-active { border-color: var(--accent) !important; background: color-mix(in srgb, var(--accent) 5%, var(--card-bg, var(--surface))) !important; }
.model-card-inactive { opacity: 0.65; }
.model-card-inactive select:disabled { opacity: 0.5; cursor: not-allowed; }
.tag-active { background: var(--accent); color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
.tag-standby { background: var(--surface-2); color: var(--text-3); font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
.badge-free { background: #10b981; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; letter-spacing: 0.3px; }
html { font-size: 14px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}

/* ============ LAYOUT ============ */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 100; overflow-y: auto;
  transition: transform var(--transition);
}
.nav-item i { width: 18px; height: 18px; flex-shrink: 0; }
.section-title i { width: 20px; height: 20px; flex-shrink: 0; }
.empty-state .empty-icon i { width: 48px; height: 48px; stroke-width: 1.5; }
.toast-icon i { width: 18px; height: 18px; }
.sidebar-logo {
  padding: 16px 20px; font-size: 18px; font-weight: 700;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-logo .logo-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: #ffffff; color: #000000;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #0b1120;
}
.sidebar-logo span { color: #ffffff; }
.sidebar-nav { flex: 1; padding: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius);
  color: var(--text-2); cursor: pointer; transition: all var(--transition);
  font-size: 13px; font-weight: 500; border: none; background: none; width: 100%;
  text-align: left;
}
.nav-item:hover { background: #1a1a1a; color: #ffffff; }
.nav-item.active { background: #1a1a1a; color: #ffffff; }

.sidebar-footer {
  padding: 12px; border-top: 1px solid var(--border);
}
.sidebar-footer .nav-item { font-size: 12px; padding: 8px 14px; }

/* Main */
.main {
  margin-left: var(--sidebar); flex: 1; display: flex; flex-direction: column;
  min-height: 100vh;
}
.header {
  height: var(--header-h); background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; position: sticky; top: 0; z-index: 50;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header-left .menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.content { padding: 24px; flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; }

/* Status badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.badge-dot { width: 7px; height: 7px; border-radius: 50%; }
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-green .badge-dot { background: var(--green); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-red .badge-dot { background: var(--red); }
.badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
.badge-yellow .badge-dot { background: var(--yellow); }

/* ============ STATS GRID ============ */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px 20px; transition: border-color var(--transition);
}
.stat-card:hover { border-color: var(--border-light); }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); font-weight: 600; }
.stat-value { font-size: 24px; font-weight: 700; margin-top: 4px; }
.stat-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ============ SECTION CONTAINER ============ */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.section-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ============ CARDS ============ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }

/* ============ TABLES ============ */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
th { background: var(--surface-2); color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; font-weight: 600; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface-2); }

/* ============ FORMS ============ */
input, select, textarea {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font);
  width: 100%; transition: border-color var(--transition);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; font-family: var(--mono); font-size: 12px; }
label { font-size: 12px; color: var(--text-2); font-weight: 500; display: block; margin-bottom: 4px; }
.form-group { margin-bottom: 14px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all var(--transition);
  text-decoration: none; line-height: 1.4;
}
.btn-primary { background: #ffffff; color: #000000; }
.btn-primary:hover { background: #e0e0e0; }
.btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--red); color: white; }
.btn-danger:hover { opacity: .85; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-xs { padding: 2px 8px; font-size: 11px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-icon { padding: 6px; width: 32px; height: 32px; justify-content: center; }

/* ============ TOGGLE ============ */
.toggle { position: relative; width: 40px; height: 22px; display: inline-block; cursor: pointer; }
.toggle input { display: none; }
.toggle .slider {
  position: absolute; inset: 0; background: var(--border); border-radius: 11px;
  transition: var(--transition);
}
.toggle .slider::before {
  content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px;
  background: var(--text); border-radius: 50%; transition: var(--transition);
}
.toggle input:checked + .slider { background: #ffffff; }
.toggle input:checked + .slider::before { transform: translateX(18px); }

/* ============ LOADING ============ */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: skel 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-row { height: 14px; margin-bottom: 10px; width: 100%; }
.skel-row:last-child { width: 60%; }
.skel-card { height: 80px; }
.skel-table { height: 200px; }

/* ============ TOAST ============ */
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }

.toast-container {
  position: fixed; bottom: 20px; right: 20px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px; max-width: 360px;
}
.toast {
  padding: 12px 16px; border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  display: flex; align-items: flex-start; gap: 10px;
  animation: slideIn .3s ease; font-size: 13px; line-height: 1.4;
}
.toast-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.toast-body { flex: 1; }
.toast-close { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 16px; padding: 0 4px; }
.toast-success { border-left: 3px solid var(--green); }
.toast-error { border-left: 3px solid var(--red); }
.toast-info { border-left: 3px solid var(--accent); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .15s ease;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 24px; max-width: 520px; width: 90vw; max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: scaleIn .2s ease;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--text-3); font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ============ EMPTY STATE ============ */
.empty-state { padding: 48px 24px; text-align: center; color: var(--text-3); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; }

/* ============ KEY VALUE DISPLAY ============ */
.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 600px) { .kv-grid { grid-template-columns: 1fr; } }

/* ============ RESPONSIVE ============ */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .header-left .menu-btn { display: flex; }
  .content { padding: 16px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .form-row { flex-direction: column; }
}

/* ============ MISC ============ */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.mb-4 { margin-bottom: 16px; }
.mt-2 { margin-top: 8px; }
.mt-4 { margin-top: 16px; }
.text-muted { color: var(--text-2); }
.text-subtle { color: var(--text-3); }
.text-accent { color: #ffffff; }
.text-green { color: var(--green); }
.text-red { color: var(--red); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-center { text-align: center; }
.font-mono { font-family: var(--mono); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.w-full { width: 100%; }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; background: #1a1a1a; color: #cccccc;
  margin: 2px;
}

/* ============ SPECIFIC ============ */
.api-key-display {
  font-family: var(--mono); font-size: 13px;
  padding: 6px 10px; background: var(--bg); border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 8px; width: 100%;
}
.persona-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.persona-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; transition: border-color var(--transition);
}
.persona-card:hover { border-color: var(--border-light); }
.persona-name { font-weight: 600; color: #ffffff; margin-bottom: 4px; font-size: 14px; }
.persona-preview { font-size: 12px; color: var(--text-3); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.progress-bar {
  width: 100%; height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; margin-top: 4px;
}
.progress-bar .fill {
  height: 100%; border-radius: 3px; transition: width .5s ease;
}
.fill-green { background: var(--green); }
.fill-blue { background: #ffffff; }
.fill-yellow { background: var(--yellow); }
.sys-stat { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.chart-container { position: relative; height: 180px; width: 100%; margin-top: 8px; }
.chart-wrap {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px; margin-bottom: 16px;
}
.chart-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-2); }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
@media (max-width: 600px) { .stats-row { grid-template-columns: 1fr; } }
</style>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i data-lucide="bot" width="24" height="24" stroke-width="2"></i></div>
      <div><span>Bot</span>-WA</div>
    </div>
    <nav class="sidebar-nav" id="nav">
      <button class="nav-item active" data-tab="overview"><i data-lucide="layout-dashboard" width="18" height="18"></i>Overview</button>
      <button class="nav-item" data-tab="keys"><i data-lucide="key-round" width="18" height="18"></i>API Keys</button>
      <button class="nav-item" data-tab="model"><i data-lucide="brain-circuit" width="18" height="18"></i>Model</button>
      <button class="nav-item" data-tab="skills"><i data-lucide="blocks" width="18" height="18"></i>Skills</button>
      <button class="nav-item" data-tab="whitelist"><i data-lucide="users" width="18" height="18"></i>Whitelist</button>
      <button class="nav-item" data-tab="persona"><i data-lucide="user-cog" width="18" height="18"></i>Persona</button>
      <button class="nav-item" data-tab="profiles"><i data-lucide="file-text" width="18" height="18"></i>Profiles</button>
      <button class="nav-item" data-tab="tiktok"><i data-lucide="music" width="18" height="18"></i>TikTok</button>
      <button class="nav-item" data-tab="stock"><i data-lucide="video" width="18" height="18"></i>Stock</button>
      <button class="nav-item" data-tab="settings"><i data-lucide="settings" width="18" height="18"></i>Settings</button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="showChangePw()"><i data-lucide="lock" width="18" height="18"></i>Change Password</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="header">
      <div class="header-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <span class="badge" id="statusBadge"><span class="badge-dot"></span> Loading...</span>
      </div>
      <div class="header-right">
        <span class="text-subtle text-sm" id="uptimeDisplay"></span>
        <span class="text-subtle text-sm" id="versionDisplay"></span>
      </div>
    </header>

    <div class="content" id="content">
      <div id="statsGrid" class="stats-grid"></div>
      <div id="tabContent"></div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toasts"></div>

<!-- Modal Container -->
<div id="modalRoot"></div>

<!-- Login Overlay -->
<div id="loginOverlay" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:2000;flex-direction:column;gap:20px">
  <div style="text-align:center">
    <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#0b1120;margin:0 auto 16px">B</div>
    <h2 style="font-size:20px;font-weight:700"><span style="color:var(--accent)">Bot-WA</span> Dashboard</h2>
    <p style="color:var(--text-3);font-size:13px;margin-top:4px">Masuk untuk mengelola bot</p>
  </div>
  <div class="card" style="min-width:320px;max-width:360px;width:90vw">
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password dashboard" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div id="loginError" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none"></div>
    <button class="btn btn-primary w-full" id="loginBtn" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- Change Password Modal (hidden by default via JS) -->
<div id="changePwModal" style="display:none">
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-header"><div class="modal-title"><i data-lucide="lock" width="18" height="18"></i> Ganti Password</div><button class="modal-close" onclick="closeChangePw()">✕</button></div>
      <div class="form-group"><label>Password saat ini</label><input type="password" id="cp-old" placeholder="Password lama"></div>
      <div class="form-group"><label>Password baru</label><input type="password" id="cp-new" placeholder="Minimal 4 karakter"></div>
      <div class="form-group"><label>Konfirmasi password baru</label><input type="password" id="cp-confirm" placeholder="Ulangi password baru" onkeydown="if(event.key==='Enter') doChangePassword()"></div>
      <div id="cpError" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none"></div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="doChangePassword()">Simpan</button><button class="btn btn-ghost" onclick="closeChangePw()">Batal</button></div>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const API = '';
let authToken = localStorage.getItem('bot_wa_token') || '';
let _env = {};
let _models = [];

// ==================== API HELPER ====================
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const r = await fetch(API + path, { headers, ...opts });
  if (r.status === 401) { setToken(''); showLogin(); return null; }
  return r.json();
}

function setToken(t) { authToken = t; t ? localStorage.setItem('bot_wa_token', t) : localStorage.removeItem('bot_wa_token'); }

// ==================== TOAST SYSTEM ====================
function toast(msg, type = 'info', duration = 4000) {
  const icons = { success: 'check-circle', error: 'x-circle', info: 'info', warning: 'triangle-alert' };
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span class="toast-icon"><i data-lucide="${icons[type] || 'info'}" width="18" height="18"></i></span><div class="toast-body">${msg}</div><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;
  container.appendChild(el);
  setTimeout(() => { if (el.parentElement) el.remove(); }, duration);
}

// ==================== MODAL SYSTEM ====================
function showModal(html) {
  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = html;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  root.appendChild(overlay);
  return overlay;
}

// ==================== TEMPLATES ====================
function loadingSkeleton(type = 'table') {
  if (type === 'table') return '<div class="table-wrap"><div style="padding:20px"><div class="skeleton skel-table"></div></div></div>';
  if (type === 'card') return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">'+Array(4).fill('<div class="skeleton skel-card" style="border-radius:10px"></div>').join('')+'</div>';
  return '<div class="skeleton" style="height:120px;border-radius:10px"></div>';
}

function emptyState(icon, text) {
  return `<div class="empty-state"><div class="empty-icon"><i data-lucide="${icon}" width="48" height="48" stroke-width="1.5"></i></div><p>${text}</p></div>`;
}

// ==================== AUTH ====================
function showLogin() {
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  setTimeout(() => document.getElementById('loginPassword').focus(), 100);
}

function doLogin() {
  const pw = document.getElementById('loginPassword').value;
  if (!pw) return;
  const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Memproses...';
  fetch(API + '/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw })
  }).then(r => r.json()).then(d => {
    if (d.success) {
      setToken(d.token); document.getElementById('loginOverlay').style.display = 'none';
      init();
    } else {
      document.getElementById('loginError').textContent = d.error || 'Password salah';
      document.getElementById('loginError').style.display = 'block';
    }
  }).catch(() => { document.getElementById('loginError').textContent = 'Gagal terhubung ke server'; document.getElementById('loginError').style.display = 'block'; })
  .finally(() => { btn.disabled = false; btn.textContent = 'Masuk';
    setTimeout(() => lucide.createIcons(), 200); });
}

function showChangePw() {
  document.getElementById('cp-old').value = '';
  document.getElementById('cp-new').value = '';
  document.getElementById('cp-confirm').value = '';
  document.getElementById('cpError').style.display = 'none';
  document.getElementById('changePwModal').style.display = 'block';
}

function closeChangePw() { document.getElementById('changePwModal').style.display = 'none'; }

function doChangePassword() {
  const oldPw = document.getElementById('cp-old').value;
  const newPw = document.getElementById('cp-new').value;
  const confirmPw = document.getElementById('cp-confirm').value;
  if (!oldPw || !newPw) { showCpError('Isi semua field'); return; }
  if (newPw !== confirmPw) { showCpError('Password baru tidak cocok'); return; }
  if (newPw.length < 4) { showCpError('Password minimal 4 karakter'); return; }
  api('/api/auth/change-password', { method: 'POST', body: JSON.stringify({ oldPassword: oldPw, newPassword: newPw }) }).then(d => {
    if (d && d.success) { setToken(d.token); closeChangePw(); toast('Password berhasil diganti!', 'success'); }
    else { showCpError(d?.error || 'Gagal'); }
  });
}
function showCpError(msg) { const el = document.getElementById('cpError'); el.textContent = msg; el.style.display = 'block'; }

// ==================== NAVIGATION ====================
let _currentTab = 'overview';

function navigate(tab) {
  _currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  // Close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
  renderTab(tab);
}

document.getElementById('nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (item && item.dataset.tab) navigate(item.dataset.tab);
});

document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

// ==================== TAB RENDERER ====================
async function renderTab(tab) {
  const el = document.getElementById('tabContent');
  el.innerHTML = loadingSkeleton();
  try {
    switch (tab) {
      case 'overview': await renderOverview(); break;
      case 'keys': await renderApiKeys(); break;
      case 'model': await renderModel(); break;
      case 'skills': await renderSkills(); break;
      case 'whitelist': await renderWhitelist(); break;
      case 'persona': await renderPersona(); break;
      case 'profiles': await renderProfiles(); break;
      case 'tiktok': await renderTikTok(); break;
      case 'stock': await renderStock(); break;
      case 'settings': await renderSettings(); break;
    }
  } catch (e) {
    el.innerHTML = emptyState('alert-circle', 'Error: ' + e.message);
  }
}

async function renderStock() {

  const stocks = data?.stocks || [];

  let html = `
    <div class="section-header">
      <div class="section-title"><i data-lucide="video" width="20" height="20"></i>Stock Content</div>
      <div class="text-xs text-subtle">${data?.total || 0} total video</div>
    </div>

  `;

  if (stocks.length === 0) {

  } else {
    for (const s of stocks) {
      html += `
        <div class="card" style="padding:10px">
          <div style="aspect-ratio:9/16;background:#000;border-radius:6px;overflow:hidden;margin-bottom:8px;position:relative">

            <div style="position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:4px;font-size:10px">
              ${(s.video_size / 1024 / 1024).toFixed(1)}MB
            </div>
          </div>
          <div class="text-xs truncate" title="${s.topic}"><strong>${s.topic}</strong></div>
          <div class="text-xs text-subtle mb-2">${new Date(s.created_at).toLocaleDateString()}</div>

async function deleteStock(id) {
  if (!confirm('Hapus video ini?')) return;
  const res = await api('/api/stock/' + id, { method: 'DELETE' });
  if (res?.success) {
    toast('Stock dihapus', 'success');
    renderStock();
  }
}

// ==================== OVERVIEW TAB ====================
async function renderOverview() {
  const [status, tokens] = await Promise.all([api('/api/status'), api('/api/tokens')]);
  if (!status) return;
  const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : n;
  const h = Math.floor((status.uptime||0) / 3600);
  const m = Math.floor(((status.uptime||0) % 3600) / 60);
  const firstStart = status.firstStart ? new Date(parseInt(status.firstStart)).toLocaleString('id-ID') : '-';
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Status Bot</div>
      <div class="stat-value ${status.connected ? 'text-green' : 'text-red'}">${status.connected ? '● Aktif' : '○ Mati'}</div>
      <div class="stat-sub">${status.connected ? 'WhatsApp terhubung' : 'Tidak terhubung'}</div></div>
    <div class="stat-card"><div class="stat-label">Uptime</div>
      <div class="stat-value">${h}<span style="font-size:14px">j</span> ${m}<span style="font-size:14px">m</span></div>
      <div class="stat-sub">Bot berjalan</div></div>
    <div class="stat-card"><div class="stat-label">Pesan Sesi</div>
      <div class="stat-value text-accent">${fmt(status.messageCount||0)}</div>
      <div class="stat-sub">Sejak start</div></div>
    <div class="stat-card"><div class="stat-label">Total Pesan</div>
      <div class="stat-value">${fmt(status.totalMessages||0)}</div>
      <div class="stat-sub">Seumur hidup</div></div>
    <div class="stat-card"><div class="stat-label">Restart</div>
      <div class="stat-value">${status.restartCount||0}</div>
      <div class="stat-sub">Total restart</div></div>
    <div class="stat-card"><div class="stat-label">Video Dibuat</div>
      <div class="stat-value text-accent">${status.videosGenerated||0}</div>
      <div class="stat-sub">Total video</div></div>
    <div class="stat-card"><div class="stat-label">Online Sejak</div>
      <div class="stat-value text-sm text-accent">${firstStart}</div>
      <div class="stat-sub">Pertama kali jalan</div></div>
    <div class="stat-card"><div class="stat-label">Skills</div>
      <div class="stat-value">${status.skillsCount||0}</div>
      <div class="stat-sub">Aktif</div></div>
    <div class="stat-card"><div class="stat-label">Whitelist</div>
      <div class="stat-value">${status.whitelistCount||0}</div>
      <div class="stat-sub">User diizinkan</div></div>
    <div class="stat-card"><div class="stat-label">Token Usage</div>
      <div class="stat-value text-accent">${fmt(tokens?.totalAll||0)}</div>
      <div class="stat-sub">${tokens?.count||0} calls</div></div>`;

    // ==================== SYSTEM STATS ====================
  const sys = await api('/api/system');
  if (sys) {
    const memTotal = (sys.memory.total / 1024 / 1024 / 1024).toFixed(1);
    const memUsed = (sys.memory.used / 1024 / 1024 / 1024).toFixed(1);
    const memFree = (sys.memory.free / 1024 / 1024 / 1024).toFixed(1);
    const memPct = Math.round((sys.memory.used / sys.memory.total) * 100);
    const cpuPct = sys.cpu.usage;
    const diskFree = sys.disk.free || '-';
    const diskTotal = sys.disk.total || '-';
    const diskPct = parseInt(sys.disk.usage) || 0;
    const sysUptime = Math.floor(sys.uptime / 3600) + 'j ' + Math.floor((sys.uptime % 3600) / 60) + 'm';

    document.getElementById('statsGrid').insertAdjacentHTML('beforeend', `
      <div class="stat-card"><div class="stat-label">CPU</div>
        <div class="stat-value text-sm">${cpuPct}%</div>
        <div class="progress-bar"><div class="fill fill-blue" style="width:${cpuPct}%"></div></div>
        <div class="sys-stat">${sys.cpu.cores} core · load ${sys.cpu.load[0].toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-label">RAM</div>
        <div class="stat-value text-sm">${memUsed}GB / ${memTotal}GB</div>
        <div class="progress-bar"><div class="fill fill-green" style="width:${memPct}%"></div></div>
        <div class="sys-stat">${memFree}GB free · ${memPct}% used</div></div>
      <div class="stat-card"><div class="stat-label">Disk</div>
        <div class="stat-value text-sm">${diskFree} / ${diskTotal}</div>
        <div class="progress-bar"><div class="fill fill-yellow" style="width:${diskPct}%"></div></div>
        <div class="sys-stat">${diskPct}% used</div></div>
      <div class="stat-card"><div class="stat-label">System Uptime</div>
        <div class="stat-value text-sm">${sysUptime}</div>
        <div class="sys-stat">${sys.hostname} · ${sys.platform}</div></div>
    `);

    const tokenTotal = tokens?.totalAll || 0;
    const tokenCount = tokens?.count || 0;

    // Charts
    document.getElementById('tabContent').innerHTML = `
      <div class="stats-row">
        <div class="chart-wrap">
          <div class="chart-title">API Usage</div>
          <div class="chart-container" style="height:130px">
            <canvas id="chartTokens"></canvas>
          </div>
        </div>
        <div class="chart-wrap">
          <div class="chart-title">Memory Usage</div>
          <div class="chart-container"><canvas id="chartMem"></canvas></div>
        </div>
      </div>
    `;

    // Extract sys data into local vars safe for closure
    try {
      var mUsed = memUsed;
      var mFree = memFree;
      var mPct = memPct;
      var tTotal = tokenTotal;
      var tCount = tokenCount;
    } catch(e) { /* fallback */ }

    // Token bar chart
    var tokCanvas = document.getElementById('chartTokens');
    if (tokCanvas) {
      var avgCall = tCount > 0 ? Math.round(tTotal / tCount) : 0;
      new Chart(tokCanvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: ['Total Calls', 'Avg Tokens/Call'],
          datasets: [{
            data: [tCount, avgCall],
            backgroundColor: ['#ffffff', '#666666'],
            borderRadius: 4,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          indexAxis: 'y',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(ctx) {
                  var val = ctx.raw;
                  return ctx.label + ': ' + (val >= 1000 ? (val/1000).toFixed(1) + 'K' : val);
                }
              }
            }
          },
          scales: {
            x: { grid: { color: '#2a2a2a' }, ticks: { color: '#999' } },
            y: { grid: { display: false }, ticks: { color: '#ccc' } }
          }
        }
      });
    }

    // Memory donut
    var memCanvas = document.getElementById('chartMem');
    if (memCanvas) {
      new Chart(memCanvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: ['Used', 'Free'],
          datasets: [{
            data: [mPct, 100 - mPct],
            backgroundColor: ['#4ade80', '#1a1a1a'],
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { display: true, position: 'bottom', labels: { color: '#ccc', padding: 12 } },
            tooltip: {
              callbacks: {
                label: function(ctx) {
                  return ctx.label + ': ' + (ctx.label === 'Used' ? mUsed + 'GB' : mFree + 'GB');
                }
              }
            }
          }
        }
      });
    }
  }

  // tabContent filled by charts above
  setTimeout(() => lucide.createIcons(), 100);
}

// ==================== API KEYS TAB ====================
async function renderApiKeys() {
  const keys = await api('/api/keys');
  if (!keys || !keys.length) { document.getElementById('tabContent').innerHTML = emptyState('key-round', 'Tidak ada API key'); return; }

  let html = `<div class="section-header"><div class="section-title"><i data-lucide="key-round" width="20" height="20"></i>API Keys</div></div>
  <div style="display:grid;gap:12px">`;

  for (const k of keys) {
    const id = 'key-' + k.key;
    html += `<div class="card" id="${id}">
      <div class="flex items-center justify-between mb-2">
        <div><strong>${k.label}</strong><br><span class="text-subtle text-xs">${k.key}</span></div>
        <div class="flex gap-2">
          <button class="btn btn-sm btn-ghost" onclick="testKey('${k.key}')" id="test-${k.key}">Test</button>
          <a href="${k.docs}" target="_blank" class="btn btn-sm btn-ghost" style="text-decoration:none"><i data-lucide="external-link" width="14" height="14"></i></a>
        </div>
      </div>
      <div class="api-key-display mb-2">
        <span id="val-${k.key}" style="flex:1">${k.isSet ? k.masked : '<span class="text-subtle">—</span>'}</span>
        ${k.isSet ? `<button class="btn btn-xs btn-ghost" onclick="toggleKeyVisibility('${k.key}')"></button>` : ''}
      </div>
      <div class="form-row">
        <input type="password" id="input-${k.key}" placeholder="API key baru..." value="">
        <button class="btn btn-primary btn-sm" onclick="saveKey('${k.key}')">Simpan</button>
      </div>
      <div id="status-${k.key}" class="text-xs mt-2" style="color:var(--text-3)"></div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('tabContent').innerHTML = html;
  setTimeout(() => lucide.createIcons(), 50);
}

async function saveKey(key) {
  const val = document.getElementById('input-' + key).value.trim();
  if (!val) { toast('Masukkan API key', 'warning'); return; }
  const btn = document.querySelector(`#key-${key} .btn-primary`);
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  const res = await api('/api/keys', { method: 'PUT', body: JSON.stringify({ key, value: val }) });
  btn.disabled = false; btn.textContent = 'Simpan';
  if (res && res.success) {
    toast(`${res.provider} API key tersimpan!`, 'success');
    renderApiKeys();
  } else {
    toast(res?.error || 'Gagal menyimpan', 'error');
  }
}

async function testKey(key) {
  const btn = document.getElementById('test-' + key);
  const status = document.getElementById('status-' + key);
  btn.disabled = true; btn.textContent = 'Testing...'; status.innerHTML = '<i data-lucide="loader" width="14" height="14" class="spin"></i> Mengecek...';
  const res = await api('/api/keys/test', { method: 'POST', body: JSON.stringify({ key }) });
  btn.disabled = false; btn.textContent = 'Test';
  if (res && res.success) {
    status.textContent = res.message;
    status.style.color = 'var(--green)';
    toast(res.message, 'success');
  } else {
    status.textContent = '✗ ' + (res?.error || 'Gagal');
    status.style.color = 'var(--red)';
    toast(res?.error || 'Test gagal', 'error');
  }
}

function toggleKeyVisibility(key) {
  const el = document.getElementById('val-' + key);
  if (!el.dataset.real) {
    // Fetch actual key
    api('/api/keys').then(keys => {
      const k = keys.find(x => x.key === key);
      if (!k || !k.isSet) return;
      // We need the real key. Use settings endpoint.
      api('/api/settings').then(all => {
        const real = all[key];
        if (real) {
          el.dataset.real = real;
          el.textContent = real;
        }
      });
    });
  } else {
    // Hide again - we don't have the masked value handy
    renderApiKeys();
  }
}

          <span style="width:8px;height:8px;border-radius:50%;background:${currProvider === 'anthropic' ? 'var(--green)' : 'var(--text-3)'}"></span>
          Claude 3 Haiku
        </label>
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0">
          <code style="font-size:12px;background:var(--bg);padding:6px 10px;border-radius:6px;border:1px solid var(--border);flex:1">Anthropic Console</code>
        </div>
      </div>
    </div>

    <div class="card model-card ${currProvider === '9router' ? 'model-card-active' : 'model-card-inactive'}">
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:6px">
          <span style="width:8px;height:8px;border-radius:50%;background:${currProvider === '9router' ? 'var(--green)' : 'var(--text-3)'}"></span>
          9Router Load Balancer
        </label>
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0">
          <code style="font-size:12px;background:var(--bg);padding:6px 10px;border-radius:6px;border:1px solid var(--border);flex:1">🤖 Multi-Model (Random)</code>
        </div>
      </div>
    </div>
  </div>`;

  html += `<div class="card">
    <div class="section-title" style="font-size:14px;margin-bottom:8px"><i data-lucide="shield-check" width="18" height="18"></i>Fallback & Safety</div>
    <div class="text-sm text-subtle mb-3">Bot akan mencoba model-model berikut secara berurutan jika model utama gagal:</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <span class="tag" style="background:var(--surface-2);border:1px solid var(--accent)">${current || 'llama-3.3-70b'}</span>
      ${models.filter(m => m.id !== current).slice(0,6).map(m => `<span class="tag">${m.id}</span>`).join('')}
    </div>
    <p class="text-xs text-subtle mt-3"><i>*Sistem fallback otomatis memastikan bot tetap bisa menjawab meski sedang traffic tinggi.</i></p>
  </div>`;

  document.getElementById('tabContent').innerHTML = html;
  setTimeout(() => lucide.createIcons(), 50);
}

async function refreshModels() {
  document.getElementById('modelStatus').innerHTML = '<i data-lucide="loader" width="14" height="14" class="spin"></i> Mendeteksi...';
  const data = await api('/api/models/refresh', { method: 'POST' });
  if (data && data.success) {
    renderModel();
    toast(`${data.models.length} model terdeteksi!`, 'success');
  } else {
    document.getElementById('modelStatus').textContent = '✗ Gagal. Cek API key Groq.';
    toast('Gagal mendeteksi model', 'error');
  }
}

async function setProvider(provider) {
  ['groq', 'gemini', 'anthropic', '9router'].forEach(p => {
    const el = document.getElementById('prov' + p.charAt(0).toUpperCase() + p.slice(1));
    if (el) el.className = 'btn btn-sm ' + (provider === p ? 'btn-primary' : 'btn-ghost');
  });

  const statusEl = document.getElementById('providerStatus');
  if (statusEl) {
    statusEl.innerHTML = provider === '9router' ? '<b>9Router Aktif:</b> Menggunakan load-balancer 9Router.' : 
                        provider === 'gemini' ? '<b>Gemini Aktif:</b> Menggunakan Google Gemini 1.5 Flash.' :
                        provider === 'anthropic' ? '<b>Anthropic Aktif:</b> Menggunakan Claude 3 Haiku.' :
                        '<b>Groq Aktif:</b> Menggunakan model spesifik dari Groq.';
  }

  const res = await api('/api/provider', { method: 'POST', body: JSON.stringify({ provider }) });
  if (res && res.success) {
    toast('AI Provider: ' + provider, 'success');
    renderModel(); // Re-render to update card opacity/disabled state
  } else {
    toast('Gagal ganti provider', 'error');
  }
}

async function saveModel(modelId) {
  if (!modelId) return;
  await api('/api/settings', { method: 'PUT', body: JSON.stringify({ key: 'GROQ_MODEL', value: modelId }) });
  toast(`Model disimpan: ${modelId}`, 'success');
}

// ==================== SKILLS TAB ====================
async function renderSkills() {
  const skills = await api('/api/skills');
  if (!skills || !skills.length) { document.getElementById('tabContent').innerHTML = emptyState('blocks', 'Belum ada skill'); return; }

  let html = `<div class="section-header"><div class="section-title"><i data-lucide="blocks" width="20" height="20"></i>Skills</div>
    <div class="text-xs text-subtle">${skills.length} terinstall</div></div>
  <div class="table-wrap"><table><thead><tr><th>Skill</th><th>Commands</th><th>Status</th><th>Aksi</th></tr></thead><tbody>`;

  for (const s of skills) {
    html += `<tr>
      <td><strong>${s.title || s.name}</strong><br><span class="text-subtle text-xs">${s.description || ''}</span></td>
      <td>${(s.commands || []).map(c => `<span class="tag">/${c}</span>`).join(' ') || '<span class="text-subtle">-</span>'}</td>
      <td><label class="toggle"><input type="checkbox" ${s.enabled ? 'checked' : ''} data-name="${s.name}" onchange="toggleSkill(this)"><span class="slider"></span></label></td>
      <td>${s.has_config ? `<button class="btn btn-xs btn-ghost" onclick="showSkillConfig('${s.name}')">Config</button>` : '<span class="text-subtle">-</span>'}</td>
    </tr>`;
  }

  html += `</tbody></table></div>`;
  document.getElementById('tabContent').innerHTML = html;
}

async function toggleSkill(el) {
  const name = el.dataset.name;
  const r = await api('/api/skills/' + name + '/toggle', { method: 'PUT', body: JSON.stringify({ enabled: el.checked }) });
  if (r?.success) toast(`${name}: ${r.enabled ? 'diaktifkan' : 'dinonaktifkan'}`, 'info');
}

async function showSkillConfig(name) {
  const cfg = await api('/api/skills/' + name + '/config');
  const keys = Object.keys(cfg || {});
  if (!keys.length) { toast('Tidak ada konfigurasi', 'info'); return; }

  let body = '';
  for (const k of keys) {
    body += `<div class="form-group">
      <label>${k}</label>
      <div class="form-row"><input type="text" id="cfg-${name}-${k}" value="${cfg[k] || ''}">
      <button class="btn btn-sm btn-primary" onclick="saveSkillConfig('${name}','${k}')">Save</button></div>
    </div>`;
  }

  const modal = showModal(`
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><div class="modal-title"><i data-lucide="sliders" width="18" height="18"></i> Config: ${name}</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
      ${body}
    </div>
  `);
}

async function saveSkillConfig(name, key) {
  const value = document.getElementById('cfg-' + name + '-' + key).value;
  await api('/api/skills/' + name + '/config', { method: 'PUT', body: JSON.stringify({ key, value }) });
  toast('Config saved!', 'success');
}

// ==================== WHITELIST TAB ====================
async function renderWhitelist() {
  const [list, settings] = await Promise.all([api('/api/whitelist'), api('/api/settings')]);
  const isPrivate = settings?.PRIVATE_MODE === 'true' || settings?.PRIVATE_MODE === true;
  const listArr = list || [];

  let html = `<div class="section-header"><div class="section-title"><i data-lucide="users" width="20" height="20"></i>Whitelist</div>
    <div class="section-actions">
      <button class="btn btn-sm btn-ghost" onclick="showAddWhitelist()"><i data-lucide="user-plus" width="14" height="14"></i> Tambah</button>
    </div></div>
  <div class="text-xs text-subtle mb-3">${listArr.length} user diizinkan</div>`;

  if (!listArr.length) {
    html += emptyState('user-x', 'Belum ada user di whitelist');
  } else {
    html += `<div class="table-wrap"><table><thead><tr><th>#</th><th>Nama</th><th>JID</th><th>Aksi</th></tr></thead><tbody>`;
    listArr.forEach((item, i) => {
      html += `<tr>
        <td>${i + 1}</td>
        <td>${item.name || '-'}</td>
        <td style="font-family:var(--mono);font-size:12px">${item.jid}</td>
        <td><button class="btn btn-xs btn-danger" onclick="removeWhitelist('${item.jid}')">Hapus</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  document.getElementById('tabContent').innerHTML = html;
}

function showAddWhitelist() {
  const modal = showModal(`
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><div class="modal-title"><i data-lucide="user-plus" width="18" height="18"></i> Tambah Whitelist</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
      <div class="form-group"><label>Nomor WhatsApp</label><input id="wl-jid" placeholder="628xxx atau 628xxx@s.whatsapp.net" onkeydown="if(event.key==='Enter') document.getElementById('wl-name').focus()"></div>
      <div class="form-group"><label>Nama (opsional)</label><input id="wl-name" placeholder="Nama user" onkeydown="if(event.key==='Enter') doAddWhitelist()"></div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="doAddWhitelist()">Tambah</button><button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Batal</button></div>
    </div>
  `);
  setTimeout(() => document.getElementById('wl-jid').focus(), 100);
}

async function doAddWhitelist() {
  let jid = document.getElementById('wl-jid').value.trim();
  const name = document.getElementById('wl-name').value.trim();
  if (!jid) { toast('Masukkan nomor!', 'warning'); return; }
  if (!jid.includes('@')) jid = jid + '@s.whatsapp.net';
  const r = await api('/api/whitelist', { method: 'POST', body: JSON.stringify({ jid, name }) });
  if (r?.success) { document.querySelector('.modal-overlay')?.remove(); renderWhitelist(); toast('Ditambahkan!', 'success'); }
}

async function removeWhitelist(jid) {
  const modal = showModal(`
    <div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
      <div class="modal-header"><div class="modal-title"><i data-lucide="trash-2" width="18" height="18"></i> Hapus Whitelist</div></div>
      <p class="text-sm mb-4">Yakin ingin menghapus <strong>${jid}</strong>?</p>
      <div class="modal-footer"><button class="btn btn-danger" onclick="confirmRemoveWhitelist('${jid}')">Ya, Hapus</button><button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Batal</button></div>
    </div>
  `);
}

async function confirmRemoveWhitelist(jid) {
  await api('/api/whitelist/' + encodeURIComponent(jid), { method: 'DELETE' });
  document.querySelector('.modal-overlay')?.remove();
  renderWhitelist();
  toast('Dihapus!', 'info');
}

// ==================== PERSONA TAB ====================
async function renderPersona() {
  const data = await api('/api/modes/custom');
  const defaults = data?.defaults || [];
  const custom = data?.custom || [];

  let html = `<div class="section-header"><div class="section-title"><i data-lucide="user-cog" width="20" height="20"></i>Persona / Mode</div>
    <button class="btn btn-sm btn-ghost" onclick="showAddPersona()"><i data-lucide="plus" width="14" height="14"></i> Buat Baru</button></div>`;

  // Default modes
  html += `<div class="card mb-4">
    <div class="flex items-center justify-between mb-3">
    <h4 style="font-size:14px;font-weight:600"><i data-lucide="bookmark" width="16" height="16"></i> Mode Default</h4>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${defaults.map(d => `<span class="tag" style="padding:4px 12px">${d.name}</span>`).join('')}
    </div>
  </div>`;

  // Custom modes
  if (custom.length) {
    html += `<div class="persona-grid">`;
    for (const m of custom) {
      const preview = (m.system_prompt || '').substring(0, 150);
      html += `<div class="persona-card">
        <div class="flex items-center justify-between mb-2">
          <div class="persona-name">${m.name}</div>
          <div class="flex gap-2">
            <button class="btn btn-xs btn-ghost" onclick="editPersona('${m.name}')">Edit</button>
            <button class="btn btn-xs btn-danger" onclick="deletePersona('${m.name}')">Hapus</button>
          </div>
        </div>
        <div class="text-xs text-subtle mb-2">Temperature: ${m.temperature}</div>
        <div class="persona-preview">${preview}${preview.length >= 150 ? '...' : ''}</div>
      </div>`;
    }
    html += `</div>`;
  } else {
    html += emptyState('smile-plus', 'Belum ada mode kustom.');
  }

  document.getElementById('tabContent').innerHTML = html;
}

function showAddPersona() {
  const modal = showModal(personaFormHtml('', 'Buat Persona Baru'));
}

function editPersona(name) {
  api('/api/modes/custom/' + name).then(m => {
    if (!m) return;
    showModal(personaFormHtml(m.name, 'Edit: ' + m.name, m.system_prompt, m.temperature));
  });
}

function personaFormHtml(name, title, prompt, temp) {
  return `<div class="modal" onclick="event.stopPropagation()" style="max-width:600px">
    <div class="modal-header"><div class="modal-title">${title}</div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    ${name ? '' : '<div class="form-group"><label>Nama mode</label><input id="pf-name" placeholder="contoh: galak, imut, santai"></div>'}
    <div class="form-group"><label>System Prompt</label>
      <textarea id="pf-prompt" rows="8" placeholder="Instruksi untuk AI...">${prompt || ''}</textarea></div>
    <div class="form-group">
      <label>Temperature (0.1 = kaku, 1.0 = kreatif) <span id="pf-temp-val">${temp || 0.85}</span></label>
      <input type="range" id="pf-temp" min="0.1" max="1.0" step="0.05" value="${temp || 0.85}"
        oninput="document.getElementById('pf-temp-val').textContent=this.value">
    </div>
    <div id="pf-error" class="text-sm" style="color:var(--red);margin-bottom:8px;display:none"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="${name ? `updatePersona('${name}')` : 'createPersona()'}">Simpan</button>
      <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Batal</button>
    </div>
  </div>`;
}

async function createPersona() {
  const name = document.getElementById('pf-name').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
  const prompt = document.getElementById('pf-prompt').value.trim();
  const temp = document.getElementById('pf-temp').value;
  if (!name || !prompt) { showPfError('Isi nama dan prompt'); return; }
  const r = await api('/api/modes/custom', { method: 'POST', body: JSON.stringify({ name, system_prompt: prompt, temperature: temp }) });
  if (r?.error) { showPfError(r.error); return; }
  document.querySelector('.modal-overlay')?.remove(); renderPersona();
  toast('Persona "' + name + '" dibuat!', 'success');
}

async function updatePersona(name) {
  const prompt = document.getElementById('pf-prompt').value.trim();
  const temp = document.getElementById('pf-temp').value;
  if (!prompt) { showPfError('Isi prompt'); return; }
  await api('/api/modes/custom/' + name, { method: 'PUT', body: JSON.stringify({ system_prompt: prompt, temperature: temp }) });
  document.querySelector('.modal-overlay')?.remove(); renderPersona();
  toast('Persona "' + name + '" diperbarui!', 'success');
}

function showPfError(msg) { const el = document.getElementById('pf-error'); el.textContent = msg; el.style.display = 'block'; }

async function deletePersona(name) {
  const modal = showModal(`
    <div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
      <div class="modal-header"><div class="modal-title"><i data-lucide="trash-2" width="18" height="18"></i> Hapus Persona</div></div>
      <p class="text-sm mb-4">Yakin ingin menghapus mode <strong>"${name}"</strong>?</p>
      <div class="modal-footer"><button class="btn btn-danger" onclick="confirmDeletePersona('${name}')">Ya, Hapus</button>
      <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Batal</button></div>
    </div>
  `);
}

async function confirmDeletePersona(name) {
  await api('/api/modes/custom/' + name, { method: 'DELETE' });
  document.querySelector('.modal-overlay')?.remove();
  renderPersona();
  toast('Persona "' + name + '" dihapus!', 'info');
}

// ==================== PROFILES TAB ====================
async function renderProfiles() {
  const profiles = await api('/api/profiles');
  const arr = profiles || [];

  let html = `<div class="section-header"><div class="section-title"><i data-lucide="file-text" width="20" height="20"></i>Profil User</div>
    <div class="text-xs text-subtle">${arr.length} user</div></div>
  <p class="text-sm text-subtle mb-4">Fakta yang diingat bot tentang setiap user (diekstrak otomatis dari percakapan)</p>`;

  if (!arr.length) {
    html += emptyState('file-text', 'Belum ada profil.');
  } else {
    html += `<div class="table-wrap"><table><thead><tr><th>User</th><th>Fakta</th><th>Timezone</th><th>Update</th></tr></thead><tbody>`;
    for (const p of arr) {
      const facts = (p.facts || []).map(f => `<span class="tag">${f}</span>`).join('') || '<span class="text-subtle">-</span>';
      const name = p.name || p.jid?.split('@')[0] || '?';
      html += `<tr>
        <td><strong>${name}</strong><br><span class="text-xs text-subtle font-mono">${p.jid || ''}</span></td>
        <td style="max-width:300px">${facts}</td>
        <td>${p.timezone || 'Asia/Jakarta'}</td>
        <td class="text-xs text-subtle">${p.updated_at ? new Date(p.updated_at).toLocaleDateString('id-ID') : '-'}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }

  document.getElementById('tabContent').innerHTML = html;
}

// ==================== SETTINGS TAB ====================
async function renderSettings() {
  const settings = await api('/api/settings');
  const keys = Object.keys(settings || {});
  if (!keys.length) { document.getElementById('tabContent').innerHTML = emptyState('settings', 'Belum ada pengaturan'); return; }

  let html = `<div class="section-header"><div class="section-title"><i data-lucide="settings" width="20" height="20"></i>Pengaturan</div>
    <div class="text-xs text-subtle">${keys.length} item</div></div>
  <div class="table-wrap"><table><thead><tr><th>Key</th><th>Value</th><th>Aksi</th></tr></thead><tbody>`;

  for (const k of keys) {
    const isBool = settings[k] === 'true' || settings[k] === 'false';
    html += `<tr>
      <td style="font-weight:500;font-family:var(--mono);font-size:12px">${k}</td>
      <td>${isBool
        ? `<label class="toggle"><input type="checkbox" ${settings[k] === 'true' ? 'checked' : ''} onchange="saveSetting('${k}', this.checked)"><span class="slider"></span></label>`
        : `<input type="text" id="set-${k}" value="${settings[k] || ''}" style="max-width:300px" onkeydown="if(event.key==='Enter') saveSetting('${k}')">`
      }</td>
      <td>${isBool ? '' : `<button class="btn btn-xs btn-primary" onclick="saveSetting('${k}')">Save</button>`}</td>
    </tr>`;
  }

  html += `</tbody></table></div>`;
  document.getElementById('tabContent').innerHTML = html;
}

async function saveSetting(key, val) {
  const value = val !== undefined ? (val ? 'true' : 'false') : document.getElementById('set-' + key).value;
  await api('/api/settings', { method: 'PUT', body: JSON.stringify({ key, value }) });
  toast(`Pengaturan "${key}" disimpan!`, 'success');
}

// ==================== TOP STATUS BAR ====================
async function updateStatusBar() {
  const s = await api('/api/status');
  if (!s) return;
  const badge = document.getElementById('statusBadge');
  if (s.connected) {
    badge.className = 'badge badge-green';
    badge.innerHTML = '<span class="badge-dot"></span> Connected';
  } else {
    badge.className = 'badge badge-red';
    badge.innerHTML = '<span class="badge-dot"></span> Disconnected';
  }
  const h = Math.floor((s.uptime || 0) / 3600);
  const m = Math.floor(((s.uptime || 0) % 3600) / 60);
  document.getElementById('uptimeDisplay').textContent = h + 'h ' + m + 'm';
}

// ==================== INIT ====================
async function init() {
  document.getElementById('loginOverlay').style.display = 'none';
  await updateStatusBar();
  await renderOverview();
  setInterval(updateStatusBar, 10000);
  setTimeout(() => lucide.createIcons(), 100);
}
